# Ubuntu 24.04. Certbot fills the ssl_certificate lines after the first HTTP challenge.
# sudo certbot --nginx -d blixtbo.se -d www.blixtbo.se -d stats.blixtbo.se

server {
    listen 80;
    server_name blixtbo.se www.blixtbo.se;
    location / {
        proxy_pass http://127.0.0.1:43123;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name stats.blixtbo.se;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
