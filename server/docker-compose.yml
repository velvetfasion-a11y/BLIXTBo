services:
  api:
    build: .
    env_file: .env
    environment:
      # The API serves users and the owner. It must not be able to unwrap login secrets
      # or open a sealed password. The public seal key, if set, comes from env_file.
      WORKER_KEK: ""
      WORKER_SEAL_PRIVATE: ""
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      # Admin SDK. FIREBASE_SERVICE_ACCOUNT, DATA_BACKEND, WORKER_KEK and
      # WORKER_SEAL_PRIVATE come from env_file. LANDLORD_MODE is not pinned here.
      # Set FIRESTORE_EMULATOR_HOST=host.docker.internal:8088 to use the emulator.
      LANDLORD_MODE: ${LANDLORD_MODE:-dry-run}
    command: ["python", "-m", "blixtbo.scheduler"]
    depends_on:
      db:
        condition: service_healthy
    shm_size: "1gb"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blixtbo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: blixtbo
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=20"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blixtbo"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
