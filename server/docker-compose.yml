services:
  api:
    build: .
    env_file: .env
    environment:
      # The API serves users and the owner. It must not be able to unwrap login secrets.
      WORKER_KEK: ""
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "blixtbo.scheduler"]
    depends_on:
      db:
        condition: service_healthy
    shm_size: "1gb"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blixtbo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: blixtbo
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=20"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blixtbo"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
