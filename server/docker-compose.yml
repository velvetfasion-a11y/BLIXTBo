services:
  api:
    build: .
    env_file: .env
    environment:
      # The API serves users and the owner. It must not be able to unwrap login secrets.
      WORKER_KEK: ""
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      # Admin SDK. FIREBASE_SERVICE_ACCOUNT and DATA_BACKEND come from env_file.
      # Set FIRESTORE_EMULATOR_HOST=host.docker.internal:8088 to use the emulator.
      LANDLORD_MODE: dry-run
    command: ["python", "-m", "blixtbo.scheduler"]
    depends_on:
      db:
        condition: service_healthy
    shm_size: "1gb"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blixtbo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: blixtbo
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-umami.sh:/docker-entrypoint-initdb.d/init-umami.sh:ro
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=20"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blixtbo"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
